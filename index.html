<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的工作台 · 每日打卡</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F4B6C2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<style>
  :root {
    --bg: #FDF6F0; --card: #FFFFFF; --ink: #4A3F3A; --ink-soft: #8B7E78; --ink-faint: #C9BCB5; --line: #F0E6DE;
    --health: #A8C9A8; --health-deep: #7BA87B; --beauty: #F4B6C2; --beauty-deep: #E08899;
    --growth: #B8B4D9; --growth-deep: #8A82B5; --family: #F2D9B6; --family-deep: #D4A875;
    --leisure: #A9D6E5; --leisure-deep: #6BAEC4;
    --shadow: 0 2px 12px rgba(180, 150, 130, 0.08); --shadow-soft: 0 1px 4px rgba(180, 150, 130, 0.06); --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; font-size: 15px; -webkit-font-smoothing: antialiased; padding-bottom: 90px; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }
  .header { padding: 28px 0 16px; text-align: center; }
  .header .date { font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; letter-spacing: 1px; }
  .header h1 { font-size: 22px; font-weight: 600; color: var(--ink); letter-spacing: 0.5px; }
  .header .greeting { font-size: 13px; color: var(--ink-soft); margin-top: 6px; }
  .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 18px 0 22px; }
  .stat-card { background: var(--card); border-radius: var(--radius); padding: 14px 10px; text-align: center; box-shadow: var(--shadow-soft); }
  .stat-card .num { font-size: 26px; font-weight: 700; line-height: 1.1; margin-bottom: 2px; }
  .stat-card .num.fire { color: var(--beauty-deep); } .stat-card .num.green { color: var(--health-deep); } .stat-card .num.purple { color: var(--growth-deep); }
  .stat-card .label { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.5px; }
  .section { margin-bottom: 26px; }
  .section-title { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 15px; font-weight: 600; color: var(--ink); }
  .section-title .dot { width: 8px; height: 8px; border-radius: 50%; }
  .section-title .count { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--ink-soft); }
  .section-title .count b { color: var(--ink); font-weight: 600; }
  .task-list { display: flex; flex-direction: column; gap: 8px; }
  .task-item { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 12px; padding: 14px; box-shadow: var(--shadow-soft); cursor: pointer; transition: transform 0.15s ease; border-left: 3px solid transparent; position: relative; }
  .task-item:active { transform: scale(0.98); }
  .task-item.done { opacity: 0.55; border-left-color: var(--health-deep); }
  .task-item.done .task-name { text-decoration: line-through; }
  .task-item.future { cursor: default; opacity: 0.85; background: var(--bg); }
  .task-item.future .check-box { border-color: var(--line); background: var(--line); }
  .task-item.future .check-box svg { opacity: 0; }
  .check-box { flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--ink-faint); display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; background: transparent; }
  .task-item.done .check-box { background: var(--health); border-color: var(--health); }
  .check-box svg { width: 14px; height: 14px; stroke: white; stroke-width: 3; fill: none; opacity: 0; transition: opacity 0.2s ease; }
  .task-item.done .check-box svg { opacity: 1; }
  .task-info { flex: 1; min-width: 0; }
  .task-name { font-size: 15px; color: var(--ink); margin-bottom: 2px; }
  .task-time-label { font-size: 12px; color: var(--beauty-deep); font-weight: 600; margin-right: 6px; }
  .task-meta { font-size: 11px; color: var(--ink-soft); display: flex; gap: 8px; align-items: center; }
  .task-tag { display: inline-block; padding: 1px 7px; border-radius: 8px; font-size: 10px; line-height: 1.5; }
  .tag-health { background: rgba(168,201,168,0.25); color: var(--health-deep); }
  .tag-beauty { background: rgba(244,182,194,0.25); color: var(--beauty-deep); }
  .tag-growth { background: rgba(184,180,217,0.25); color: var(--growth-deep); }
  .tag-family { background: rgba(242,217,182,0.3); color: var(--family-deep); }
  .tag-leisure { background: rgba(169,214,229,0.3); color: var(--leisure-deep); }
  .tag-life { background: rgba(200,188,180,0.25); color: var(--ink-soft); }
  .task-progress { font-size: 11px; color: var(--ink-soft); flex-shrink: 0; padding-right: 4px; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .task-progress.done { color: var(--health-deep); font-weight: 600; }
  .task-progress .mini-bar { width: 40px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .task-progress .mini-bar .mini-fill { height: 100%; background: var(--beauty-deep); border-radius: 2px; transition: width 0.3s ease; }
  .task-progress.done .mini-bar .mini-fill { background: var(--health-deep); }
  .add-task-btn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px; border: 1.5px dashed var(--ink-faint); border-radius: 12px; color: var(--ink-soft); font-size: 13px; cursor: pointer; background: transparent; width: 100%; }
  .add-task-btn:active { background: var(--line); }
  .calendar-card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-soft); }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-header .month-label { font-size: 15px; font-weight: 600; color: var(--ink); }
  .cal-nav { display: flex; gap: 8px; }
  .cal-nav button { background: var(--bg); border: none; width: 28px; height: 28px; border-radius: 50%; color: var(--ink-soft); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .cal-nav button:active { background: var(--line); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-weekday { text-align: center; font-size: 10px; color: var(--ink-faint); padding: 4px 0; }
  .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; border-radius: 8px; font-size: 12px; color: var(--ink); position: relative; cursor: pointer; }
  .cal-day.other { color: var(--ink-faint); opacity: 0.4; }
  .cal-day.today { background: var(--beauty); color: white; font-weight: 600; }
  .cal-day.selected { box-shadow: 0 0 0 2px var(--beauty-deep) inset; }
  .cal-day .rate-bar { position: absolute; bottom: 2px; left: 20%; right: 20%; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .cal-day .rate-bar .fill { height: 100%; background: var(--health-deep); }
  .mood-card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-soft); text-align: center; }
  .mood-card .q { font-size: 14px; color: var(--ink-soft); margin-bottom: 12px; }
  .mood-row { display: flex; justify-content: center; gap: 12px; }
  .mood-btn { font-size: 26px; background: var(--bg); border: none; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; transition: transform 0.15s ease; filter: grayscale(0.5); opacity: 0.6; }
  .mood-btn:active { transform: scale(1.15); }
  .mood-btn.selected { background: var(--card); filter: grayscale(0); opacity: 1; box-shadow: var(--shadow); }
  .tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: flex; padding: 7px 0 max(7px, env(safe-area-inset-bottom)); z-index: 100; }
  .tab { flex: 1; text-align: center; padding: 4px 0; color: var(--ink-faint); cursor: pointer; transition: color 0.2s ease; }
  .tab.active { color: var(--beauty-deep); }
  .tab .icon { font-size: 19px; line-height: 1; }
  .tab .name { font-size: 10px; margin-top: 2px; }
  .modal-mask { position: fixed; inset: 0; background: rgba(74, 63, 58, 0.4); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
  .modal-mask.show { display: flex; }
  .modal { background: var(--card); border-radius: var(--radius); padding: 20px; max-width: 380px; width: 100%; max-height: 85vh; overflow-y: auto; }
  .modal h3 { font-size: 16px; margin-bottom: 14px; text-align: center; }
  .modal .field { margin-bottom: 12px; }
  .modal .field label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  .modal .field input, .modal .field select { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-family: inherit; box-sizing: border-box; background: var(--bg); color: var(--ink); }
  .modal .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 10px; background: var(--bg); color: var(--ink); font-size: 14px; cursor: pointer; margin-bottom: 8px; }
  .modal .btn:active { background: var(--line); }
  .modal .btn.primary { background: var(--beauty); color: white; }
  .modal .btn.danger { background: transparent; color: var(--beauty-deep); }
  .modal .close { text-align: center; color: var(--ink-soft); font-size: 13px; margin-top: 4px; cursor: pointer; }
  .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(74,63,58,0.92); color: white; padding: 10px 18px; border-radius: 20px; font-size: 13px; z-index: 300; transition: transform 0.3s ease; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .page { display: none; } .page.active { display: block; }
  .stat-block { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-soft); margin-bottom: 12px; }
  .stat-block h4 { font-size: 14px; margin-bottom: 10px; color: var(--ink); }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; }
  .bar-row .name { width: 70px; color: var(--ink-soft); flex-shrink: 0; }
  .bar-row .bar { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar-row .bar .fill { height: 100%; border-radius: 4px; }
  .bar-row .pct { width: 36px; text-align: right; color: var(--ink-soft); }
  .empty { text-align: center; padding: 40px 20px; color: var(--ink-faint); font-size: 13px; }
  /* 时间轴 */
  .timeline { position: relative; padding-left: 8px; }
  .timeline::before { content: ''; position: absolute; left: 63px; top: 10px; bottom: 10px; width: 2px; background: var(--line); }
  .tl-item { position: relative; display: flex; gap: 14px; margin-bottom: 12px; align-items: flex-start; }
  .tl-time { flex-shrink: 0; width: 44px; text-align: right; font-size: 12px; color: var(--ink-soft); padding-top: 6px; line-height: 1.3; font-weight: 500; }
  .tl-dot { flex-shrink: 0; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--beauty); background: var(--card); margin-top: 8px; z-index: 1; }
  .tl-dot.done { background: var(--health-deep); border-color: var(--health-deep); }
  .tl-card { flex: 1; background: var(--card); border-radius: 10px; padding: 12px; box-shadow: var(--shadow-soft); }
  .tl-card.done .tl-title { text-decoration: line-through; opacity: 0.55; }
  .tl-card .tl-title { font-size: 14px; color: var(--ink); margin-bottom: 2px; }
  .tl-card .tl-desc { font-size: 11px; color: var(--ink-soft); }
  /* 规划页 */
  .plan-cat-card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-soft); margin-bottom: 12px; }
  .plan-cat-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .plan-cat-header .cat-icon { font-size: 18px; }
  .plan-cat-header .cat-name { font-size: 15px; font-weight: 600; color: var(--ink); }
  .plan-cat-header .cat-count { margin-left: auto; font-size: 11px; color: var(--ink-soft); }
  .plan-task-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 13px; border-radius: 6px; transition: background 0.15s ease; cursor: pointer; }
  .plan-task-row:active { background: var(--bg); }
  .plan-task-row:last-child { border-bottom: none; }
  .plan-task-row .pt-name { color: var(--ink); }
  .plan-task-row .pt-freq { font-size: 11px; color: var(--ink-soft); background: var(--bg); padding: 2px 8px; border-radius: 8px; }
  /* 智能调整 */
  .smart-bar { background: var(--card); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow-soft); }
  .smart-btn { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--growth-deep); cursor: pointer; }
  .smart-input-row { display: flex; gap: 8px; margin-top: 10px; }
  .smart-input-row input { flex: 1; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-family: inherit; background: var(--bg); color: var(--ink); }
  .smart-input-row button { padding: 0 16px; border: none; border-radius: 8px; background: var(--growth-deep); color: white; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .smart-preview { font-size: 12px; color: var(--ink-soft); margin-top: 8px; padding: 8px 10px; background: var(--bg); border-radius: 8px; line-height: 1.5; }
  .smart-preview b { color: var(--growth-deep); }
  .smart-active { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--growth-deep); }
  .smart-active .tag { background: rgba(184,180,217,0.2); padding: 2px 8px; border-radius: 8px; }
  .smart-active .cancel { margin-left: auto; color: var(--beauty-deep); cursor: pointer; font-size: 11px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="page active" id="page-home">
    <div class="header">
      <div class="date" id="todayDate"></div>
      <div style="display:flex;align-items:center;justify-content:center;gap:8px;">
        <h1>我的工作台</h1>
        <button id="refreshBtn" style="background:none;border:none;font-size:18px;cursor:pointer;padding:4px;">🔄</button>
      </div>
      <div class="greeting" id="greeting"></div>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="num fire" id="streakNum">0</div><div class="label">连续打卡</div></div>
      <div class="stat-card"><div class="num green" id="todayRate">0%</div><div class="label">今日完成</div></div>
      <div class="stat-card"><div class="num purple" id="weekRate">0%</div><div class="label">本周完成</div></div>
    </div>
    <div id="smartAdjustBar" style="margin-bottom:12px;"></div>
    <div class="section">
      <div class="section-title"><span class="dot" style="background:var(--beauty-deep)"></span>今日必做<span class="count"><b id="dailyDone">0</b>/<span id="dailyTotal">0</span></span></div>
      <div class="task-list" id="dailyList"></div>
    </div>
    <div class="section">
      <div class="section-title"><span class="dot" style="background:var(--growth-deep)"></span>本周任务<span class="count"><b id="weekDone">0</b>/<span id="weekTotal">0</span></span></div>
      <div class="task-list" id="weekList"></div>
    </div>
    <div class="section">
      <div class="section-title"><span class="dot" style="background:var(--family-deep)"></span>本月任务<span class="count"><b id="monthDone">0</b>/<span id="monthTotal">0</span></span></div>
      <div class="task-list" id="monthList"></div>
    </div>
    <div class="section">
      <div class="section-title"><span class="dot" style="background:var(--leisure-deep)"></span>本季度任务<span class="count"><b id="quarterDone">0</b>/<span id="quarterTotal">0</span></span></div>
      <div class="task-list" id="quarterList"></div>
    </div>
    <div class="section">
      <div class="section-title"><span class="dot" style="background:var(--beauty-deep)"></span>今日心情</div>
      <div class="mood-card"><div class="q">今天感觉怎么样？</div>
        <div class="mood-row" id="moodRow">
          <button class="mood-btn" data-mood="1">😢</button><button class="mood-btn" data-mood="2">😕</button><button class="mood-btn" data-mood="3">😐</button><button class="mood-btn" data-mood="4">🙂</button><button class="mood-btn" data-mood="5">😄</button>
        </div>
      </div>
    </div>
  </div>

  <div class="page" id="page-calendar">
    <div class="header"><h1>打卡日历</h1><div class="greeting">点击日期查看时间轴</div></div>
    <div class="section"><div class="calendar-card">
      <div class="cal-header"><div class="month-label" id="calMonthLabel"></div><div class="cal-nav"><button id="calToday" style="font-size:11px;width:auto;padding:0 10px;border-radius:14px;">今天</button><button id="calPrev">‹</button><button id="calNext">›</button></div></div>
      <div class="cal-grid" id="calGrid"></div>
    </div></div>
    <div class="section">
      <div class="section-title"><span class="dot" style="background:var(--beauty-deep)"></span><span id="calDayLabel">选择日期查看</span></div>
      <div class="timeline" id="calTimeline"><div class="empty">点击上方日期查看详情</div></div>
      <div id="calExtraTasks" style="margin-top:12px;"></div>
    </div>
  </div>

  <div class="page" id="page-plan">
    <div class="header"><h1>总体规划</h1><div class="greeting">2026 年度目标全览</div></div>
    <div class="section" id="planContainer"></div>
    <div class="section"><button class="add-task-btn" id="planAddTaskBtn">+ 添加新任务</button></div>
  </div>

  <div class="page" id="page-settings">
    <div class="header"><h1>设置</h1></div>
    <div class="section">
      <div class="stat-block"><h4 style="margin-bottom:14px;">任务管理</h4>
        <button class="btn primary" id="manageTasksBtn">编辑任务（增删改）</button>
        <button class="btn" id="goPlanBtn">查看总体规划</button>
      </div>
      <div class="stat-block"><h4 style="margin-bottom:14px;">数据管理</h4>
        <button class="btn primary" id="exportBtn">导出数据备份</button>
        <button class="btn" id="importBtn">导入数据备份</button>
        <input type="file" id="importFile" accept=".json" style="display:none">
        <button class="btn danger" id="clearBtn">清空所有数据</button>
      </div>
      <div class="stat-block"><h4 style="margin-bottom:10px;">关于</h4>
        <div style="font-size:13px;color:var(--ink-soft);line-height:1.8;">数据存储在浏览器本地，换设备请用"导出备份"<br>清空浏览器缓存会丢失数据，记得定期备份<br><br><b>使用建议：</b><br>1. 每天打开一次，完成一项勾一项<br>2. 允许自己偶尔断卡，别追求完美<br>3. 重点关注"连续打卡天数"<br>4. 完成比完美重要</div>
      </div>
    </div>
  </div>
</div>
<div class="modal-mask" id="modalMask"><div class="modal" id="modalContent"></div></div>
<div class="toast" id="toast"></div>
<div class="tabbar">
  <div class="tab active" data-page="home"><div class="icon">🏠</div><div class="name">首页</div></div>
  <div class="tab" data-page="calendar"><div class="icon">📅</div><div class="name">日历</div></div>
  <div class="tab" data-page="plan"><div class="icon">📋</div><div class="name">规划</div></div>
  <div class="tab" data-page="settings"><div class="icon">⚙️</div><div class="name">设置</div></div>
</div>
<script>
const DEFAULT_TASKS = [
  // 每日（4项）
  { id: 'wash', name: '洗漱', cat: 'health', freq: 'daily', target: 1, time: '07:30' },
  { id: 'breakfast', name: '早餐', cat: 'life', freq: 'daily', target: 1, time: '08:00' },
  { id: 'skincare', name: '护肤', cat: 'beauty', freq: 'daily', target: 1, time: '22:00' },
  { id: 'sleep', name: '睡觉', cat: 'health', freq: 'daily', target: 1, time: '23:00' },
  // 每周（9项）
  { id: 'english', name: '学英语', cat: 'growth', freq: 'weekly', target: 3, time: '08:30', days: [1, 3, 5] },
  { id: 'writing', name: '练字', cat: 'growth', freq: 'weekly', target: 2, time: '08:30', days: [2, 4] },
  { id: 'meridian', name: '经络梳头', cat: 'health', freq: 'weekly', target: 2, time: '22:10', days: [1, 4] },
  { id: 'mask', name: '面膜', cat: 'beauty', freq: 'weekly', target: 2, time: '22:05', days: [2, 5] },
  { id: 'makeup', name: '化妆', cat: 'beauty', freq: 'weekly', target: 2, time: '08:15', days: [1, 4] },
  { id: 'reading', name: '阅读', cat: 'growth', freq: 'weekly', target: 2, time: '09:00', days: [6, 7] },
  { id: 'sport', name: '运动', cat: 'health', freq: 'weekly', target: 2, time: '22:30', days: [3, 7] },
  { id: 'piano', name: '弹钢琴', cat: 'growth', freq: 'weekly', target: 1, time: '14:00', days: [6], biweek: 0 },

const STORE_KEY = 'workbench_v5';
const OLD_KEYS = ['workbench_v4', 'workbench_v3', 'workbench_v2'];
function loadData() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) {
      // 尝试从旧版本迁移
      for (const oldKey of OLD_KEYS) {
        const old = localStorage.getItem(oldKey);
        if (old) {
          const o = JSON.parse(old);
          const migrated = { tasks: DEFAULT_TASKS, records: o.records || {}, moods: o.moods || {}, overrides: {}, startDate: o.startDate || todayStr() };
          localStorage.setItem(STORE_KEY, JSON.stringify(migrated)); // 写入新 key
          return migrated;
        }
      }
      return { tasks: DEFAULT_TASKS, records: {}, moods: {}, overrides: {}, startDate: todayStr() };
    }
    const data = JSON.parse(raw);
    if (!data.tasks) data.tasks = DEFAULT_TASKS;
    // 给旧任务补 time / days / biweek 字段
    data.tasks.forEach(t => {
      if (!t.time) { const d = DEFAULT_TASKS.find(x => x.id === t.id); t.time = d ? d.time : '08:00'; }
      if (t.freq !== 'daily' && !t.days) { const d = DEFAULT_TASKS.find(x => x.id === t.id); if (d && d.days) t.days = d.days; else t.days = []; }
      if (t.freq === 'weekly' && t.biweek === undefined) { const d = DEFAULT_TASKS.find(x => x.id === t.id); if (d && d.biweek !== undefined) t.biweek = d.biweek; }
    });
    if (!data.records) data.records = {};
    if (!data.moods) data.moods = {};
    if (!data.overrides) data.overrides = {};
    return data;
  } catch(e) { return { tasks: DEFAULT_TASKS, records: {}, moods: {}, overrides: {}, startDate: todayStr() }; }
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function dateStr(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function weekStart(s) { const d = parseDate(s); const day = d.getDay() === 0 ? 6 : d.getDay() - 1; d.setDate(d.getDate() - day); return dateStr(d); }
function monthStart(s) { return s.substring(0, 7) + '-01'; }
function quarterStart(s) { const [y, m] = s.split('-').map(Number); const q = Math.floor((m - 1) / 3) * 3 + 1; return `${y}-${pad(q)}-01`; }
function addDays(s, n) { const d = parseDate(s); d.setDate(d.getDate() + n); return dateStr(d); }
function getTaskCount(taskId, refDate) {
  const task = findTask(taskId); if (!task) return 0;
  if (task.freq === 'daily') return DB.records[taskId] && DB.records[taskId][refDate] ? 1 : 0;
  const start = task.freq === 'weekly' ? weekStart(refDate) : task.freq === 'monthly' ? monthStart(refDate) : quarterStart(refDate);
  if (!DB.records[taskId]) return 0;
  let count = 0; Object.keys(DB.records[taskId]).forEach(d => { if (d >= start && d <= refDate) count++; }); return count;
}
function toggleTask(taskId, date) { if (!DB.records[taskId]) DB.records[taskId] = {}; if (DB.records[taskId][date]) delete DB.records[taskId][date]; else DB.records[taskId][date] = 1; saveData(); }

// 计算某日期是第几周（固定基准：2026-01-05 第一个周一），用于双周交替
function getWeekIndex(date) {
  const start = parseDate('2026-01-05');
  const d = parseDate(date);
  const diff = Math.floor((d - start) / (7 * 24 * 60 * 60 * 1000));
  return diff;
}

// 判断某任务在某日期是否符合 days 规则（不含完成状态判断）
function shouldTaskShowOnDate(task, date) {
  if (task.freq === 'daily') return true;
  const d = parseDate(date);
  if (!task.days || task.days.length === 0) return true;
  if (task.freq === 'weekly') {
    if (!task.days.includes(d.getDay() === 0 ? 7 : d.getDay())) return false;
    if (task.biweek !== undefined) return getWeekIndex(date) % 2 === task.biweek;
    return true;
  }
  if (task.freq === 'monthly') return task.days.includes(d.getDate());
  if (task.freq === 'quarterly') return task.days.includes(d.getDate());
  return true;
}
function daysText(task) {
  const biweekNote = task.biweek !== undefined ? '（隔周）' : '';
  if (task.freq === 'weekly') return '周' + task.days.map(d => ['日','一','二','三','四','五','六'][d === 7 ? 0 : d]).join('、') + biweekNote;
  if (task.freq === 'monthly') return '每月' + task.days.join('、') + '号';
  if (task.freq === 'quarterly') return '每季度' + task.days.join('、') + '号';
  return '';
}

// ========== 智能调整（本地规则匹配）==========
const REST_CATS = ['leisure']; // 休闲类：休息日才做
const CORE_IDS = ['wash', 'breakfast', 'sleep']; // 核心：出差也保留

// 获取某日的调整规则
function getOverride(date) { return DB.overrides && DB.overrides[date] ? DB.overrides[date] : null; }

// 判断某任务在 override 下是否应该显示
function applyOverride(task, date) {
  const ov = getOverride(date);
  if (!ov) return true;
  if (ov.type === 'workday') {
    // 休息日变工作日：隐藏休闲类
    if (REST_CATS.includes(task.cat)) return false;
    return true;
  }
  if (ov.type === 'restday') {
    // 工作日变休息日：所有任务正常显示
    return true;
  }
  if (ov.type === 'busy') {
    // 出差/忙碌：只保留核心
    return CORE_IDS.includes(task.id);
  }
  if (ov.type === 'overtime') {
    // 加班：隐藏时间在 endTime 之后的非核心任务（运动、梳头等晚间任务）
    if (task.time && ov.endTime && task.time > ov.endTime) return false;
    return true;
  }
  return true;
}

// 综合判断：days 规则 + override
function shouldShowTask(task, date) {
  if (!shouldTaskShowOnDate(task, date)) return false;
  if (!applyOverride(task, date)) return false;
  return true;
}

// 解析用户输入
function parseUserInput(text) {
  const today = todayStr(); const todayDate = new Date();
  let targetDate = null;
  let type = null, endTime = null;

  // 日期识别
  if (/今天|今日/.test(text)) targetDate = today;
  else if (/明天|明日/.test(text)) targetDate = addDays(today, 1);
  else if (/后天/.test(text)) targetDate = addDays(today, 2);
  else {
    const weekMap = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '日': 7, '天': 7 };
    let m = text.match(/这周(.)/);
    if (m && weekMap[m[1]]) {
      const targetDay = weekMap[m[1]];
      const curDay = todayDate.getDay() === 0 ? 7 : todayDate.getDay();
      targetDate = addDays(today, targetDay - curDay);
      if (targetDate < today) targetDate = addDays(targetDate, 7);
    }
    if (!targetDate) {
      m = text.match(/下周(.)/);
      if (m && weekMap[m[1]]) {
        const targetDay = weekMap[m[1]];
        const curDay = todayDate.getDay() === 0 ? 7 : todayDate.getDay();
        targetDate = addDays(today, 7 + targetDay - curDay);
      }
    }
    if (!targetDate) {
      m = text.match(/(\d+)号/);
      if (m) {
        const dayNum = parseInt(m[1]);
        targetDate = `${todayDate.getFullYear()}-${pad(todayDate.getMonth()+1)}-${pad(dayNum)}`;
        if (targetDate < today) targetDate = addDays(targetDate, 30);
      }
    }
  }
  if (!targetDate) targetDate = today;

  // 意图识别（先判断"不上班"再判断"上班"，避免误匹配）
  if (/不上班|不加班/.test(text)) type = 'restday';
  else if (/加班/.test(text)) {
    type = 'overtime';
    const tm = text.match(/到?(\d+)[点:：](\d+)?/) || text.match(/到(\d+)点/);
    if (tm) endTime = `${pad(parseInt(tm[1]))}:${tm[2] ? pad(parseInt(tm[2])) : '00'}`;
  }
  else if (/出差|外出|忙碌|没空|很忙/.test(text)) type = 'busy';
  else if (/休息|放假|调休/.test(text)) type = 'restday';
  else if (/上班|调班|补班/.test(text)) type = 'workday';

  if (!type) return null;
  return { date: targetDate, type, endTime, reason: text };
}

function renderStats() {
  const today = todayStr(); const tasks = getTasks();
  const dt = tasks.filter(t => t.freq === 'daily');
  // 连续打卡：如果今天全打了算今天，否则从昨天往前数
  let streak = 0, cur = today;
  const todayAllDone = dt.length > 0 && dt.every(t => DB.records[t.id] && DB.records[t.id][cur]);
  if (!todayAllDone) cur = addDays(cur, -1); // 今天没全打，从昨天开始数
  while (dt.length > 0) {
    if (dt.every(t => DB.records[t.id] && DB.records[t.id][cur])) { streak++; cur = addDays(cur, -1); }
    else break;
    if (streak > 365) break;
  }
  document.getElementById('streakNum').textContent = streak;
  const td = dt.filter(t => DB.records[t.id] && DB.records[t.id][today]).length;
  document.getElementById('todayRate').textContent = dt.length > 0 ? Math.round(td / dt.length * 100) + '%' : '0%';
  const ws = weekStart(today); let wt = 0, wd = 0;
  tasks.filter(t => t.freq === 'weekly').forEach(t => { wt += t.target; wd += Math.min(getTaskCount(t.id, today), t.target); });
  tasks.filter(t => t.freq === 'daily').forEach(t => { for (let i = 0; i < 7; i++) { const d = addDays(ws, i); if (d <= today) { wt++; if (DB.records[t.id] && DB.records[t.id][d]) wd++; } } });
  document.getElementById('weekRate').textContent = wt > 0 ? Math.round(wd / wt * 100) + '%' : '0%';
}
function renderTaskList(containerId, freq, label) {

  let done = 0;
  allTasks.forEach(t => {
    let isDone;

  });

  const totalKey = freq === 'daily' ? 'dailyTotal' : freq === 'weekly' ? 'weekTotal' : freq === 'monthly' ? 'monthTotal' : 'quarterTotal';
  // total 显示今天该做的任务数（不是该频率的所有任务数）

  return todayTotal;
}

let calRef = new Date(); let calSelected = todayStr();
function renderCalendar() {

    if (ds <= today) {
      // 完成率：统计当天所有该做的任务（每日 + 符合 days 规则的周期任务）
      const allDayTasks = getTasks().filter(t => t.freq === 'daily' || shouldShowTask(t, ds));
      const done = allDayTasks.filter(t => DB.records[t.id] && DB.records[t.id][ds]).length;
      const rate = allDayTasks.length > 0 ? done / allDayTasks.length : 0;
      if (rate > 0) { const bar = document.createElement('div'); bar.className = 'rate-bar'; const fill = document.createElement('div'); fill.className = 'fill'; fill.style.width = (rate * 100) + '%'; bar.appendChild(fill); el.appendChild(bar); }
    }
    el.onclick = () => { calSelected = ds; renderCalendar(); renderCalDay(); };
    grid.appendChild(el);
  }
  const total = startWeekday + daysInMonth; const remain = (7 - total % 7) % 7;
  for (let i = 1; i <= remain; i++) { const el = document.createElement('div'); el.className = 'cal-day other'; el.textContent = i; grid.appendChild(el); }
  renderCalDay();
}
function renderCalDay() {
  const d = parseDate(calSelected); const weekdays = ['日','一','二','三','四','五','六'];
  const today = todayStr(); const isFuture = calSelected > today;
  const calOv = getOverride(calSelected);
  document.getElementById('calDayLabel').textContent = `${d.getMonth()+1}月${d.getDate()}日 周${weekdays[d.getDay()]}${isFuture ? ' · 预览' : ''}${calOv ? ' · 🔧' + (OVERRIDE_NAME[calOv.type] || '已调整') : ''}`;
  // 时间轴：每日任务 + 当天应显示的周期任务，按时间排序
  const tlTasks = getTasks().filter(t => t.freq === 'daily' || shouldShowTask(t, calSelected));
  tlTasks.sort((a,b) => (a.time||'99:99').localeCompare(b.time||'99:99'));
  const tlContainer = document.getElementById('calTimeline');
  tlContainer.innerHTML = '';
  if (tlTasks.length === 0) { tlContainer.innerHTML = `<div class="empty">${isFuture ? '📅 这天暂无安排' : '✨ 这天没有安排'}</div>`; }
  else {
    tlTasks.forEach(t => {
      const isDone = !isFuture && DB.records[t.id] && DB.records[t.id][calSelected];
      const el = document.createElement('div');
      el.className = 'tl-item';
      el.innerHTML = `<div class="tl-time">${t.time || ''}</div><div class="tl-dot ${isDone ? 'done' : ''}"></div><div class="tl-card ${isDone ? 'done' : ''}"><div class="tl-title">${t.name}</div><div class="tl-desc"><span class="task-tag tag-${t.cat}">${CAT_NAME[t.cat]}</span>${FREQ_NAME[t.freq]}${t.target>1?' '+t.target+'次':''}${t.freq!=='daily'&&t.days&&t.days.length?' · '+daysText(t):''}</div></div>`;
      if (!isFuture) { el.querySelector('.tl-card').style.cursor = 'pointer'; el.querySelector('.tl-card').onclick = () => { toggleTask(t.id, calSelected); renderCalDay(); render(); }; }
      tlContainer.appendChild(el);
    });
  }
  // 隐藏多余的周期任务列表区域
  document.getElementById('calExtraTasks').innerHTML = '';
}

// 规划页
function renderPlan() {
  const container = document.getElementById('planContainer'); container.innerHTML = '';
  const tasks = getTasks(); const cats = ['health','beauty','growth','family','leisure','life'];
  cats.forEach(cat => {
    const catTasks = tasks.filter(t => t.cat === cat);
    if (catTasks.length === 0) return;
    const el = document.createElement('div'); el.className = 'plan-cat-card';
    let rows = '';
    catTasks.forEach(t => { const daysInfo = t.freq !== 'daily' && t.days && t.days.length ? ' · ' + daysText(t) : ''; const timeInfo = t.time ? ' · ' + t.time : ''; rows += `<div class="plan-task-row" data-task-id="${t.id}"><span class="pt-name">${t.name}</span><span class="pt-freq">${FREQ_NAME[t.freq]}${t.target>1?' '+t.target+'次':''}${timeInfo}${daysInfo}</span></div>`; });
    el.innerHTML = `<div class="plan-cat-header"><span class="cat-icon">${CAT_ICON[cat]}</span><span class="cat-name">${CAT_NAME[cat]}</span><span class="cat-count">${catTasks.length} 项</span></div>${rows}`;
    el.querySelectorAll('.plan-task-row').forEach(row => { row.onclick = () => { const task = findTask(row.dataset.taskId); if (task) showDeleteTask(task); }; });
    container.appendChild(el);
  });
}

// 任务管理
function buildDaysSelector(freq, selected) {
  selected = selected || [];
  if (freq === 'weekly') {
    const names = ['一','二','三','四','五','六','日'];
    let html = '<div style="display:flex;flex-wrap:wrap;gap:6px;">';
    for (let i = 1; i <= 7; i++) {
      const on = selected.includes(i);
      html += `<div class="day-chip${on?' on':''}" data-day="${i}" style="padding:6px 12px;border-radius:8px;border:1.5px solid ${on?'var(--beauty-deep)':'var(--line)'};background:${on?'rgba(244,182,194,0.2)':'var(--bg)'};color:${on?'var(--beauty-deep)':'var(--ink-soft)'};font-size:13px;cursor:pointer;">周${names[i-1]}</div>`;
    }
    html += '</div>';
    return html;
  }
  if (freq === 'monthly' || freq === 'quarterly') {
    let html = '<div style="display:flex;flex-wrap:wrap;gap:4px;max-height:120px;overflow-y:auto;">';
    for (let i = 1; i <= 31; i++) {
      const on = selected.includes(i);
      html += `<div class="day-chip${on?' on':''}" data-day="${i}" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1.5px solid ${on?'var(--beauty-deep)':'var(--line)'};background:${on?'rgba(244,182,194,0.2)':'var(--bg)'};color:${on?'var(--beauty-deep)':'var(--ink-soft)'};font-size:11px;cursor:pointer;">${i}</div>`;
    }
    html += '</div>';
    return html;
  }
  return '';
}
function getSelectedDays() {
  return Array.from(document.querySelectorAll('.day-chip.on')).map(el => parseInt(el.dataset.day));
}
function showAddTaskModal(prefill) {
  const catOptions = Object.keys(CAT_NAME).map(c => `<option value="${c}" ${prefill && prefill.cat === c ? 'selected' : ''}>${CAT_NAME[c]}</option>`).join('');
  const freqOptions = Object.keys(FREQ_NAME).map(f => `<option value="${f}" ${prefill && prefill.freq === f ? 'selected' : ''}>${FREQ_NAME[f]}</option>`).join('');
  const initFreq = prefill ? prefill.freq : 'daily';
  showModal(`<h3>${prefill ? '编辑任务' : '添加任务'}</h3><div class="field"><label>任务名称</label><input type="text" id="taskNameInput" value="${prefill ? prefill.name : ''}" placeholder="如：练字"></div><div class="field"><label>时间</label><input type="time" id="taskTimeInput" value="${prefill ? prefill.time || '08:00' : '08:00'}"></div><div class="field"><label>分类</label><select id="taskCatInput">${catOptions}</select></div><div class="field"><label>频率</label><select id="taskFreqInput">${freqOptions}</select></div><div class="field" id="targetField"><label>目标次数${initFreq==='daily'?'（每日固定1次）':''}</label><input type="number" id="taskTargetInput" value="${prefill ? prefill.target : 1}" min="1" max="30" ${initFreq==='daily'?'disabled':''}></div><div class="field" id="daysField"><label id="daysLabel">设置周期</label><div id="daysContainer">${buildDaysSelector(initFreq, prefill ? prefill.days : null)}</div><div id="biweekField" style="margin-top:10px;display:${initFreq==='weekly'?'block':'none'};"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--ink-soft);"><input type="checkbox" id="biweekToggle" ${prefill && prefill.biweek !== undefined ? 'checked' : ''} style="width:16px;height:16px;">隔周交替（适合两个任务轮流）</label><div id="biweekHint" style="font-size:11px;color:var(--ink-faint);margin-top:4px;display:${prefill && prefill.biweek !== undefined ? 'block':'none'};">选 A 组这周做、B 组下周做，需在另一个任务上也勾选</div></div></div><button class="btn primary" id="saveTaskBtn">保存</button><div class="close" onclick="closeModal()">取消</div>`);
  document.getElementById('taskFreqInput').onchange = (e) => {
    const freq = e.target.value;
    const ti = document.getElementById('taskTargetInput');
    const df = document.getElementById('daysField');
    const dl = document.getElementById('daysLabel');
    const tfl = document.querySelector('#targetField label');
    const bwf = document.getElementById('biweekField');
    if (freq === 'daily') { ti.value = 1; ti.disabled = true; df.style.display = 'none'; if(tfl) tfl.textContent = '目标次数（每日固定1次）'; }
    else { ti.disabled = false; if (ti.value < 2) ti.value = 3; df.style.display = 'block'; if(tfl) tfl.textContent = '目标次数'; dl.textContent = freq === 'weekly' ? '设置周几（可多选）' : '设置几号（可多选）'; document.getElementById('daysContainer').innerHTML = buildDaysSelector(freq, null); bindDayChips(); bwf.style.display = freq === 'weekly' ? 'block' : 'none'; }
  };
  document.getElementById('biweekToggle').onchange = (e) => {
    const hint = document.getElementById('biweekHint');
    if (e.target.checked) {
      hint.style.display = 'block';
      hint.innerHTML = `选 A 组这周做、B 组下周做，另一个交替任务选不同组<div style="display:flex;gap:10px;margin-top:6px;"><label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink);cursor:pointer;"><input type="radio" name="biweekGroup" value="0" ${prefill && prefill.biweek === 0 ? 'checked' : (!prefill || prefill.biweek === undefined) ? 'checked' : ''} style="width:14px;height:14px;">A 组（偶数周）</label><label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink);cursor:pointer;"><input type="radio" name="biweekGroup" value="1" ${prefill && prefill.biweek === 1 ? 'checked' : ''} style="width:14px;height:14px;">B 组（奇数周）</label></div>`;
    } else { hint.style.display = 'none'; }
  };
  // 如果 prefill 已有 biweek，初始化显示
  if (prefill && prefill.biweek !== undefined) { document.getElementById('biweekToggle').onchange({ target: { checked: true } }); }
  function bindDayChips() {
    document.querySelectorAll('.day-chip').forEach(chip => {
      chip.onclick = () => {
        if (chip.classList.contains('on')) { chip.classList.remove('on'); chip.style.borderColor = 'var(--line)'; chip.style.background = 'var(--bg)'; chip.style.color = 'var(--ink-soft)'; }
        else { chip.classList.add('on'); chip.style.borderColor = 'var(--beauty-deep)'; chip.style.background = 'rgba(244,182,194,0.2)'; chip.style.color = 'var(--beauty-deep)'; }
      };
    });
  }
  bindDayChips();
  // 初始化 daysField 显示状态
  if (initFreq === 'daily') document.getElementById('daysField').style.display = 'none';
  document.getElementById('saveTaskBtn').onclick = () => {
    const name = document.getElementById('taskNameInput').value.trim();
    if (!name) { toast('请输入任务名称'); return; }
    const cat = document.getElementById('taskCatInput').value; const freq = document.getElementById('taskFreqInput').value;
    const time = document.getElementById('taskTimeInput').value;
    const target = Math.max(1, parseInt(document.getElementById('taskTargetInput').value) || 1);
    const days = freq !== 'daily' ? getSelectedDays() : undefined;
    if (freq !== 'daily' && days.length === 0) { toast('请设置周期（周几或几号）'); return; }
    const biweekChecked = document.getElementById('biweekToggle') && document.getElementById('biweekToggle').checked;
    let biweek = undefined;
    if (biweekChecked && freq === 'weekly') { const bg = document.querySelector('input[name="biweekGroup"]:checked'); biweek = bg ? parseInt(bg.value) : 0; }
    if (prefill) { const task = findTask(prefill.id); if (task) { task.name = name; task.time = time; task.cat = cat; task.freq = freq; task.target = target; if (freq !== 'daily') task.days = days; else delete task.days; if (biweek !== undefined) task.biweek = biweek; else delete task.biweek; } }
    else { const nt = { id: 't_' + Date.now(), name, time, cat, freq, target }; if (freq !== 'daily') nt.days = days; if (biweek !== undefined) nt.biweek = biweek; DB.tasks.push(nt); }
    saveData(); closeModal(); render(); renderPlan(); toast(prefill ? '任务已更新' : '任务已添加');
  };
}
function showDeleteTask(task) {
  const daysInfo = task.freq !== 'daily' && task.days && task.days.length ? ' · ' + daysText(task) : '';
  showModal(`<h3>编辑任务</h3><p style="font-size:14px;color:var(--ink);margin-bottom:14px;text-align:center;">${task.time || ''} ${task.name}${daysInfo}</p><button class="btn danger" id="confirmDelTask" style="background:var(--beauty-deep);color:white;">删除任务</button><button class="btn" id="editTaskBtn" style="background:var(--bg);">编辑详情</button><div class="close" onclick="closeModal()">取消</div>`);
  document.getElementById('confirmDelTask').onclick = () => { DB.tasks = DB.tasks.filter(t => t.id !== task.id); saveData(); closeModal(); render(); renderPlan(); toast('任务已删除'); };
  document.getElementById('editTaskBtn').onclick = () => { closeModal(); showAddTaskModal(task); };
}

// 统计（已废弃，保留空函数防止报错）
function renderStatsPage() {}

function showModal(html) { document.getElementById('modalContent').innerHTML = html; document.getElementById('modalMask').classList.add('show'); }
function closeModal() { document.getElementById('modalMask').classList.remove('show'); }
document.getElementById('modalMask').addEventListener('click', e => { if (e.target.id === 'modalMask') closeModal(); });
let toastTimer;
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2000); }

document.querySelectorAll('#moodRow .mood-btn').forEach(b => { b.onclick = () => { const m = parseInt(b.dataset.mood); const today = todayStr(); if (DB.moods[today] === m) delete DB.moods[today]; else DB.moods[today] = m; saveData(); renderMood(); toast(DB.moods[today] ? '心情已记录' : '已取消'); }; });
document.getElementById('refreshBtn').onclick = async () => {
  // 注销旧 Service Worker，清空缓存，强制从服务器重新加载
  if ('serviceWorker' in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations();
    for (const r of regs) await r.unregister();
    const cacheNames = await caches.keys();
    for (const name of cacheNames) await caches.delete(name);
  }
  location.href = location.pathname + '?v=' + Date.now();
};
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    const page = tab.dataset.page;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); tab.classList.add('active');
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById('page-' + page).classList.add('active');
    window.scrollTo(0, 0);
    if (page === 'calendar') renderCalendar();
    if (page === 'plan') renderPlan();
    if (page === 'stats') renderStatsPage();
  };
});
document.getElementById('calPrev').onclick = () => { calRef.setMonth(calRef.getMonth() - 1); renderCalendar(); };
document.getElementById('calNext').onclick = () => { calRef.setMonth(calRef.getMonth() + 1); renderCalendar(); };
document.getElementById('calToday').onclick = () => { calRef = new Date(); calSelected = todayStr(); renderCalendar(); };
document.getElementById('planAddTaskBtn').onclick = () => showAddTaskModal(null);
document.getElementById('manageTasksBtn').onclick = () => {
  showModal(`<h3>编辑任务</h3><p style="font-size:12px;color:var(--ink-soft);margin-bottom:14px;text-align:center;">点击任务可编辑或删除</p><div id="taskEditList" style="max-height:300px;overflow-y:auto;"></div><button class="btn primary" id="addNewTaskFromManage">+ 添加新任务</button><div class="close" onclick="closeModal()">关闭</div>`);
  const listEl = document.getElementById('taskEditList');
  getTasks().forEach(t => {
    const el = document.createElement('div'); el.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid var(--line);cursor:pointer;';
    el.innerHTML = `<div><div style="font-size:14px;">${t.name}</div><div style="font-size:11px;color:var(--ink-soft);">${CAT_NAME[t.cat]} · ${FREQ_NAME[t.freq]}${t.target>1?' '+t.target+'次':''}${t.time?' · '+t.time:''}${t.freq!=='daily'&&t.days&&t.days.length?' · '+daysText(t):''}</div></div><span style="color:var(--ink-faint);">›</span>`;
    el.onclick = () => { closeModal(); showDeleteTask(t); }; listEl.appendChild(el);
  });
  document.getElementById('addNewTaskFromManage').onclick = () => { closeModal(); showAddTaskModal(null); };
};
document.getElementById('goPlanBtn').onclick = () => document.querySelector('.tab[data-page="plan"]').click();
document.getElementById('exportBtn').onclick = () => { const data = JSON.stringify(DB); const blob = new Blob([data], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `工作台备份_${todayStr()}.json`; a.click(); URL.revokeObjectURL(url); toast('备份已下载'); };
document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (ev) => { try { const data = JSON.parse(ev.target.result); if (!data.records) throw new Error('格式错误'); showModal(`<h3>确认导入</h3><p style="font-size:13px;color:var(--ink-soft);margin-bottom:14px;text-align:center;">导入后将覆盖当前数据，是否继续？</p><button class="btn primary" id="confirmImport">确认导入</button><div class="close" onclick="closeModal()">取消</div>`); document.getElementById('confirmImport').onclick = () => { DB = data; if (!DB.tasks) DB.tasks = DEFAULT_TASKS; if (!DB.moods) DB.moods = {}; if (!DB.overrides) DB.overrides = {}; saveData(); closeModal(); render(); renderPlan(); toast('数据导入成功'); }; } catch(err) { toast('文件格式错误'); } }; reader.readAsText(file); e.target.value = ''; };
document.getElementById('clearBtn').onclick = () => { showModal(`<h3>清空所有数据</h3><p style="font-size:13px;color:var(--ink-soft);margin-bottom:14px;text-align:center;">此操作不可恢复！建议先导出备份。<br>确定要清空所有数据吗？</p><button class="btn danger" id="confirmClear" style="background:var(--beauty-deep);color:white;">确认清空</button><div class="close" onclick="closeModal()">取消</div>`); document.getElementById('confirmClear').onclick = () => { DB = { tasks: DEFAULT_TASKS, records: {}, moods: {}, overrides: {}, startDate: todayStr() }; saveData(); closeModal(); render(); renderPlan(); toast('已清空所有数据'); }; };

render();
// 每 7 天提醒备份一次
(function() {
  const lastBackup = DB.lastBackupReminder || '2026-01-01';
  const today = todayStr();
  const diff = Math.floor((parseDate(today) - parseDate(lastBackup)) / (7 * 24 * 60 * 60 * 1000));
  if (diff >= 1) {
    setTimeout(() => {
      if (confirm('已经一段时间没备份数据了，要现在导出备份吗？\n（数据存在本地，清缓存会丢失）')) {
        document.getElementById('exportBtn').click();
      }
      DB.lastBackupReminder = today; saveData();
    }, 3000);
  }
})();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/daka/sw.js').then(reg => { reg.addEventListener('updatefound', () => { const nw = reg.installing; nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) { nw.postMessage({ type: 'SKIP_WAITING' }); window.location.reload(); } }); }); }).catch(() => {}); }
</script>
